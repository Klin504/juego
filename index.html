<!doctype html>
<!-- Documento de entrada: carga estilos, Canvas y el módulo principal del juego. -->
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b101e">
    <meta name="description" content="Chilos Fighters: campaña de combate pixel art en el campus.">
    <link rel="icon" href="data:,">
    <title>Chilos Fighters — Campaña</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/app/main.js"></script>
  </head>
  <body>
    <!-- Canal accesible para avisos que deben anunciar los lectores de pantalla. -->
    <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <aside id="screen-warning" class="screen-warning" role="note">
      Para jugar con teclado, coloca la pantalla en horizontal y usa una ventana amplia.
    </aside>
    <!-- El juego se dibuja en Canvas; el botón del Visor queda como control HTML. -->
    <main id="juego" class="game-shell" aria-label="Chilos Fighters, campaña completa con cuatro niveles y Secreto GUÍA">
      <canvas id="arena" width="960" height="540" aria-label="Pantalla de juego Chilos Fighters"></canvas>
      <div id="hud-actions" class="hud-actions">
        <button id="btn-visor" type="button" class="btn-visor" aria-label="Activar Visor GUÍA" aria-keyshortcuts="E">
          <span class="visor-key" aria-hidden="true">E</span> VISOR GUÍA
        </button>
      </div>
      <p id="error-canvas" class="canvas-error" role="alert" hidden>
        Este navegador no pudo iniciar Canvas 2D. Prueba con una versión reciente de Chrome, Edge o Firefox.
      </p>
    </main>
  </body>
</html>
